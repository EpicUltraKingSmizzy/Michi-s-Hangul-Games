# Verbs for 🏗️ Sentence Builder and verb sentences in the other games.
# One [section] per verb, named by its dictionary form (Korean1 in its Verb Pack).
# The 해요 form comes from the pack's Polite key, or the regular rules.
#
# Say = English base, past            ("eat, ate"; "be born, was born")
# Frame = slots | English [| Say]     one sentence shape; a Frame with two slots is Master only
#   slot = particle:nouns             particle: 을 (을/를), 이 (이/가, the noun is the subject),
#                                     에, 에서, 와 (와/과), 로 ((으)로)
#   nouns = kinds or words, joined by /; -word leaves a word out; word@pack picks one of two
#   English: {v} the verb, {1} {2} the slot nouns ("an apple", or "apples" in the present),
#     {a 1} never the plural, {bare 1} without a/an/the, {at 1} {to 1} {by 1} where-phrases,
#     {my} {self} follow the subject
# Tenses = present, past, future     which tenses make sense (default all three)
# TimeWords = no                      never add 어제 / 오늘 / 내일
# Negate = no | split                 no 안 sentences | 안 goes before 하다 (공부 안 해요)
# English = negative                  the Korean verb means "not ..." (모르다)
# AlsoOk = particles                  also correct, so never offered as a wrong tile

